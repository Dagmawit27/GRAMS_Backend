name: Backend
on:
  pull_request:
    paths: ['backend/**']
  push:
    paths: ['backend/**']
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - run: ./mvnw verify
