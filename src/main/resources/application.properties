spring.application.name=backend

spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]
logging.level.org.springframework.boot.context.config=DEBUG 

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ethio_rental_db} 
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update 
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true 
# PostgreSQL Dialect (optional with recent Hibernate versions) 
spring.flyway.enabled=false

# MinIO configuration
minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
minio.bucket.property-images=${MINIO_BUCKET_PROPERTY_IMAGES:property-images}
minio.bucket.ownership-docs=${MINIO_BUCKET_OWNERSHIP_DOCS:ownership-docs}
